<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E5E3DA">
<title>Nôto</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#E5E3DA;--card:#F4F3EE;--card2:#ECEAE1;--ink:#29100C;--acc:#5A1D22;--acc2:#378696;--line:rgba(41,16,12,.22);--line2:rgba(41,16,12,.12);--brown:#29100C;--brown2:#6B5853;--greige:#CFCABD;--greige-d:#8D807A;--rose:#EADCD8;--rose-d:#5A1D22;--lav:#DCE6E8;--lav2:#E9F0F1;--lav-d:#378696;--lime:#E0DDD1;--lime2:#EAE8DF;--lime-d:#8D807A;--f-tc:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;--f-jp:'Noto Sans JP','Source Han Sans JP','源ノ角ゴシック','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans TC',sans-serif;--mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--paper)}
body{margin:0;color:var(--ink);background-color:var(--paper);background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='160' height='160'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .16 0 0 0 0 .06 0 0 0 0 .05 0 0 0 .07 0'/%3E%3C/filter%3E%3Crect width='160' height='160' filter='url(%23n)'/%3E%3C/svg%3E");font:13px/1.7 var(--f-tc);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-tc);font-weight:700;color:var(--ink);margin:0}
.jp,.art p,.art-h,.q-p,.gr-ex,.cmp td:first-child,.opt.jp,.fc-word,.fc-r,.fc-ex,.mast-t,.mast-s,.side .logo,.splash .jp{font-family:var(--f-jp)}
.jp{font-weight:500;color:var(--ink)}
.q-p.zh{font-family:var(--f-tc)}
.mono{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--brown2)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
input,textarea,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--ink);border-radius:8px;padding:8px 10px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--acc);outline:1px solid var(--acc);outline-offset:0}
input[type=checkbox]{width:auto;accent-color:var(--acc)}
textarea{resize:vertical}
small{color:var(--brown2);font-size:11.5px}
ruby rt{font-size:.5em;color:var(--brown2);font-weight:400;letter-spacing:0}
.nofuri rt{display:none}
.ic{width:20px;height:20px;flex:none}
.shell{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(92px + env(safe-area-inset-bottom))}
.side{display:none}
main{min-width:0}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--ink);z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.tabs-in{display:flex;max-width:560px;margin:0 auto}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 0 7px;font-size:10px;color:var(--greige-d);border:0;background:none;border-top:2px solid transparent;margin-top:-1px;letter-spacing:.04em}
.tab .ic{width:19px;height:19px}
.tab.on{color:var(--acc);border-top-color:var(--acc)}
@media(min-width:640px){.shell{max-width:700px}.tabs-in{max-width:700px}}
@media(min-width:960px){.shell{max-width:1060px;display:grid;grid-template-columns:200px minmax(0,1fr);gap:48px;padding-top:36px}.side{display:block;position:sticky;top:36px;align-self:start}.tabs{display:none}}
.side .logo{font-size:20px;font-weight:700;margin-bottom:2px}.side .lsub{font:10.5px var(--mono);color:var(--greige-d);margin-bottom:22px;letter-spacing:.14em}
.side .nv{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border:1px solid transparent;background:none;border-radius:10px;color:var(--brown2);text-align:left}
.side .nv.on{border-color:var(--ink);color:var(--ink);background:var(--card)}
.side .nv:hover{background:var(--card2)}
/* masthead */
.mast{border:1px solid var(--ink);border-radius:10px;background:var(--card);padding:12px 14px 14px;margin-bottom:12px}
.mast-top{display:flex;justify-content:space-between;align-items:center}
.mast-t{font-size:30px;font-weight:700;letter-spacing:.04em;margin:8px 0 0;line-height:1.1;color:var(--ink)}
.mast-s{margin:4px 0 0;font-size:11.5px;color:var(--brown2);letter-spacing:.08em}
.mast-rule{border-top:1px solid var(--ink);margin:12px 0}
.hsearch{display:flex;align-items:center;gap:8px;border:1px solid var(--ink);border-radius:8px;padding:0 10px;background:var(--paper)}
.hsearch .ic{width:16px;height:16px;color:var(--brown2)}
.hsearch input{border:0;background:none;padding:8px 0;outline:none}
.hsearch input:focus{outline:none}
.hs-r{display:flex;gap:8px;align-items:baseline;padding:7px 4px;border-bottom:1px solid var(--line2);cursor:pointer}
.hs-r span{color:var(--brown2);font-size:12px;margin-left:auto;text-align:right}
.mast-h{display:flex;justify-content:space-between;margin:14px 0 6px}
.act{display:grid;grid-template-columns:repeat(15,1fr);gap:3px;max-width:480px}
.act i{aspect-ratio:1;border-radius:2px;border:1px solid transparent;display:block}
.act i.z{border-color:var(--line)}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 8px}
.sec-h h2,.sec-h b{font-size:13px;letter-spacing:.14em}
.lnk{border:0;background:none;color:var(--brown2);font-size:12px;display:inline-flex;align-items:center;gap:3px;padding:4px 6px}.lnk .ic{width:14px;height:14px}
.lnk:hover{color:var(--acc)}
.dr{display:flex;align-items:baseline;gap:8px;padding:6px 0;border-bottom:1px solid var(--line2)}.dr:last-of-type{border:0}.dr span{margin-left:auto;color:var(--brown2);font-size:12px;text-align:right}
/* categories */
.cat{display:flex;align-items:stretch;border:1px solid var(--ink);border-radius:10px;margin-bottom:8px;background:var(--card);position:relative;touch-action:pan-y;overflow:hidden}
.cat:before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:2px;background:var(--bar,var(--ink))}
.cat.dragging{z-index:5;border-color:var(--acc);opacity:.95}
.cat-main{flex:1;display:flex;align-items:center;gap:14px;padding:14px 8px 14px 18px;min-width:0;cursor:pointer}
.cat-ic{width:38px;height:38px;border-radius:50%;border:1px solid var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.cat-ic .ic{width:19px;height:19px;stroke-width:1.2}
.cat-tx{flex:1;min-width:0}.cat-tx b{display:block;font:700 15px/1.3 var(--f-jp);letter-spacing:.06em}.cat-tx small{font-size:11px}
.cat-n{font:500 12px var(--mono);color:var(--acc);padding-right:4px}
.cat-ctl{display:flex;align-items:center;gap:2px;padding:0 8px 0 4px;border-left:1px solid var(--line2);margin:10px 0}
.handle{padding:8px 5px;color:var(--greige-d);touch-action:none;cursor:grab;display:flex}.handle .ic{width:17px;height:17px}
.xbtn{display:none;border:0;background:none;color:var(--acc);padding:6px}
.editing .xbtn{display:flex}
/* page head */
.phead{display:flex;align-items:center;gap:10px;margin:2px 0 16px;padding-bottom:12px;border-bottom:1px solid var(--ink)}
.phead h1{font-size:17px;letter-spacing:.08em}.phead small{letter-spacing:.1em;font:10.5px var(--mono)}
.phead>div{flex:1}
.back{width:32px;height:32px;border:1px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--card);flex:none}.back .ic{width:16px;height:16px}
.card{background:var(--card);border:1px solid var(--ink);border-radius:10px;padding:14px;margin-bottom:12px;position:relative}
.ct{font-size:13px;letter-spacing:.1em;display:flex;align-items:center;gap:7px;margin-bottom:10px}.ct .ic{width:16px;height:16px;stroke-width:1.3;color:var(--brown2)}
.hint{font-size:11px;color:var(--greige-d);margin:7px 0 0}
.btn{border:1px solid var(--ink);background:none;border-radius:999px;padding:7px 15px;font-size:12.5px;letter-spacing:.04em;display:inline-flex;gap:5px;align-items:center;justify-content:center;white-space:nowrap}
.btn:hover{background:var(--card2)}.btn .ic{width:15px;height:15px}
.btn.pri{background:var(--ink);color:var(--paper)}.btn.soft{background:var(--card2)}.btn.lime{background:var(--acc);border-color:var(--acc);color:#F4F3EE}
.btn.sm{padding:4px 11px;font-size:11.5px}.btn[disabled]{opacity:.4}
.srch{display:flex;gap:8px}.srch input{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:3px 11px;font-size:11.5px;color:var(--brown2);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.chip .ic{width:13px;height:13px}
.chip.on{border-color:var(--ink);color:var(--paper);background:var(--ink)}
.chip.sm{padding:1px 9px;font-size:10.5px}
.tag{display:inline-block;font-size:10px;padding:0 7px;border-radius:999px;border:1px solid var(--acc2);color:var(--acc2);margin-left:5px;vertical-align:middle;line-height:1.7;background:none}
.tag.ghost{border-color:var(--line);color:var(--greige-d)}.tag.bad{border-color:var(--acc);color:var(--acc)}.tag.lav{border-color:var(--ink);color:var(--ink)}
.drop{display:flex;align-items:center;justify-content:center;text-align:center;gap:6px;border:1px dashed var(--ink);border-radius:10px;padding:16px 10px;background:var(--paper);cursor:pointer;flex-direction:column}
.drop.over{background:var(--card2);border-color:var(--acc)}.drop b{font-weight:500;font-size:12.5px}.drop small{font-size:10.5px}.drop .ic{color:var(--ink);width:22px;height:22px;stroke-width:1.2}
.dz2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.or{display:flex;align-items:center;gap:10px;color:var(--greige-d);font-size:11px;margin:12px 0 8px}.or:before,.or:after{content:"";flex:1;border-top:1px solid var(--line)}
.rowc{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.chk{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--brown2)}
.status{font-size:12px;color:var(--brown2);margin-top:8px;min-height:1px}.status.err{color:var(--acc)}
.prog{height:2px;background:var(--line);overflow:hidden;margin-top:8px}.prog i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.sp{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}@keyframes sp{to{transform:rotate(360deg)}}
/* lists */
.cd,.wr,.gr,.res{display:flex;gap:9px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line2)}.cd:last-child,.wr:last-child,.gr:last-child,.res:last-child{border:0}
.ck{width:20px;height:20px;border:1px solid var(--ink);border-radius:5px;background:none;display:flex;align-items:center;justify-content:center;flex:none;color:transparent;padding:0}.ck .ic{width:13px;height:13px;stroke-width:2}
.cd.on .ck,.pv.on .ck{background:var(--acc);border-color:var(--acc);color:#F4F3EE}
.cd-b,.wr-b,.gr-b{flex:1;min-width:0}.cd-b b,.wr-t b{font-size:15px}.cd-b small,.wr-t small{margin-left:6px}
.mini{margin-top:5px;padding:5px 8px;font-size:12px;border-radius:6px}.en{font-size:11px;color:var(--greige-d)}
.wr-m{font-size:12px;color:var(--brown2)}.wr-b,.gr-b{cursor:pointer}
.wr-side{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.mvw{position:relative;display:inline-block}.mvw:after{content:"▾";position:absolute;right:7px;top:50%;transform:translateY(-52%);font-size:10px;pointer-events:none;color:var(--brown2)}
.mvw select{width:auto;max-width:104px;font-size:10.5px;padding:2px 20px 2px 8px;border-radius:999px;border-color:var(--line);background:none;appearance:none;-webkit-appearance:none;color:var(--brown2);text-overflow:ellipsis}
.gr-p{font-size:14px}.gr-ex{font-size:12px;margin-top:3px;padding-left:9px;border-left:1px solid var(--ink)}
.ib{width:30px;height:30px;border:0;background:none;color:var(--greige-d);display:flex;align-items:center;justify-content:center;border-radius:50%;flex:none}.ib .ic{width:17px;height:17px}.ib.on{color:var(--acc)}.ib.on .ic{fill:var(--acc)}
.ib.sm{width:26px;height:26px}.ib.sm .ic{width:15px;height:15px}
.tabsx{display:flex;gap:6px;margin-bottom:8px;overflow-x:auto;padding-bottom:6px}
.empty{text-align:center;color:var(--greige-d);padding:18px 8px;font-size:12px}
.acts2{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 2px;align-items:center}
.grid2{display:grid;gap:10px}@media(min-width:640px){.grid2{grid-template-columns:1fr 1fr}}
.tile{border:1px solid var(--ink);border-radius:10px;padding:12px;background:var(--card);display:block;text-align:left;width:100%}
.tile b{display:block;font:700 14px var(--f-tc);letter-spacing:.06em}.tile small{display:block}.tile .big{font:500 24px var(--mono);color:var(--acc)}
.big-blk{display:flex;gap:14px;align-items:center;padding:18px 14px;border-radius:10px;border:1px solid var(--ink);margin-bottom:10px;cursor:pointer;position:relative;background:var(--card)}
.big-blk .no{position:absolute;right:12px;top:8px;color:var(--greige-d)}
.big-blk .cat-ic{width:40px;height:40px}
.big-blk h2{font-size:16px;letter-spacing:.12em}.big-blk p{margin:2px 0 0;font-size:12px;color:var(--brown2)}
.news-c{display:flex;gap:12px;border:1px solid var(--ink);border-radius:10px;padding:14px;background:var(--card);margin-bottom:8px;cursor:pointer;align-items:flex-start}
.news-c .n{font:500 18px/1 var(--mono);color:var(--acc);width:24px;flex:none}
.news-c h3{font-size:14px;line-height:1.55}.news-c p{margin:5px 0 0;font-size:12px;color:var(--brown2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.art p{margin:0 0 .9em;font-size:14.5px;line-height:2.25;color:var(--ink)}
.art-h{font-size:17px;line-height:1.9;margin:4px 0 10px;font-weight:700}
.meta{font-size:11px;color:var(--greige-d);display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.seg{display:flex;border:1px solid var(--ink);border-radius:999px;padding:2px;margin-bottom:10px}.seg button{flex:1;border:0;background:none;padding:5px 4px;border-radius:999px;font-size:12px;color:var(--brown2)}.seg button.on{background:var(--ink);color:var(--paper)}
.lseg{display:inline-flex;border:1px solid var(--ink);border-radius:999px;padding:1px}.lseg button{border:0;background:none;padding:1px 10px;border-radius:999px;font-size:11px;color:var(--brown2);font-family:var(--mono)}.lseg button.on{background:var(--ink);color:var(--paper)}
/* quiz */
.q-top{display:flex;align-items:center;gap:10px;margin-bottom:14px}.q-top .prog{flex:1;margin:0}.q-top small{font:11px var(--mono)}
.q-card{background:var(--card);border:1px solid var(--ink);border-radius:10px;padding:22px 16px;margin-bottom:12px;text-align:center}
.q-p{font:500 24px/1.5 var(--f-jp);color:var(--ink);letter-spacing:.03em;word-break:break-all}.q-p.s{font-size:16px;text-align:left;line-height:1.9}.q-sub{color:var(--brown2);font-size:12px;margin-top:6px}
.q-p u{display:inline-block;min-width:3em;border-bottom:1px solid var(--ink);text-decoration:none;text-align:center;color:var(--acc)}
.opt{display:block;width:100%;text-align:left;padding:11px 13px;border:1px solid var(--ink);border-radius:10px;background:var(--card);margin-bottom:8px;font-size:13.5px;line-height:1.5}
.opt:active{background:var(--card2)}.opt.ok{background:var(--acc2);border-color:var(--acc2);color:#fff}.opt.ng{background:var(--acc);border-color:var(--acc);color:#F4F3EE}.opt[disabled]{opacity:1}
.why{border-left:2px solid var(--acc);padding:6px 10px;font-size:12px;background:var(--card2);border-radius:0 8px 8px 0;margin:6px 0 12px}
.score{font:500 44px/1 var(--mono);color:var(--acc);text-align:center;margin:10px 0 2px}
.side-by{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp{width:100%;border-collapse:collapse;font-size:12px}.cmp td{padding:8px 6px;border-bottom:1px solid var(--line2);vertical-align:top}.cmp td:first-child{font-weight:500;font-size:13px;white-space:nowrap;padding-right:12px}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(41,16,12,.4);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fd .2s}
.sheet{background:var(--paper);border:1px solid var(--ink);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:14px 14px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));animation:up .25s}
.sheet .grab{width:36px;height:3px;background:var(--ink);opacity:.35;border-radius:3px;margin:0 auto 12px}.sheet h3{font-size:15px;margin-bottom:12px;letter-spacing:.08em}
.sheet label.l{display:block;font-size:11px;color:var(--brown2);margin:10px 0 4px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}.fgrid .full{grid-column:1/-1}
@media(min-width:640px){.sheet-bg{align-items:center}.sheet{border-radius:14px}}
@keyframes fd{from{opacity:0}}@keyframes up{from{transform:translateY(24px);opacity:0}}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:7px 16px;border-radius:999px;font-size:12px;z-index:99;opacity:0;pointer-events:none;transition:opacity .25s;max-width:86vw;text-align:center}#toast.on{opacity:1}
.set-r{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0}.set-r>div:first-child{flex:1}.set-r b{font-weight:500;display:block}
.cks{display:flex;flex-wrap:wrap;gap:8px}
hr.dash{border:0;border-top:1px solid var(--line);margin:12px 0}
/* preview list */
.pv{border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px;background:var(--card)}.pv.on{border-color:var(--ink)}
.pv-h{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.pv-g{display:grid;grid-template-columns:1fr 1fr;gap:6px}.pv-g input{padding:5px 8px;font-size:12px;border-radius:6px;border-color:var(--line)}.pv-g .full{grid-column:1/-1}
.pvfoot{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom));background:var(--paper);padding:10px 0 4px;border-top:1px solid var(--ink);margin-top:8px}
/* personal */
.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--ink);border-radius:10px;background:var(--card);margin-bottom:12px;overflow:hidden}
.stats>div{padding:10px 8px;border-right:1px solid var(--ink);text-align:left}.stats>div:last-child{border:0}
.stats b{display:block;font:500 22px/1.2 var(--mono);color:var(--acc);margin:2px 0}.stats small{font-size:10.5px;display:block}
.pf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* flashcards */
.fc-wrap{touch-action:pan-y}
.fc{perspective:1200px;margin-bottom:12px}
.fc-in{position:relative;height:min(56vh,380px);min-height:320px;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.7,.2,1);cursor:pointer}
.fc-in.flip{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;background:#F4F3EE;border:1px solid var(--ink);border-radius:12px;padding:12px 14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;overflow:auto}
.fc-back{transform:rotateY(180deg)}
.fc-in:not(.flip) .fc-back,.fc-in.flip .fc-front{pointer-events:none}
.fc-meta{display:flex;justify-content:space-between;align-items:center;padding-bottom:8px;border-bottom:1px solid var(--line)}
.fc-btns{display:flex;gap:0}
.fc-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:8px 0}
.fc-word{font-size:36px;font-weight:700;line-height:1.5;display:flex;align-items:center;gap:6px;justify-content:center;flex-wrap:wrap}
.fc-pos{text-align:center;font:11px var(--mono);color:var(--brown2)}

.splash{position:fixed;inset:0;background:#29100C;color:#E5E3DA;z-index:200;display:flex;align-items:center;justify-content:center;text-align:center;animation:spOut .9s ease 1.5s forwards}

.splash .mono{color:#E5E3DA;opacity:.6;letter-spacing:.3em;margin-bottom:22px}
.splash-hi{font-size:22px;font-weight:500;letter-spacing:.12em;margin-bottom:12px}
.splash-sub{font-size:12px;opacity:.7;letter-spacing:.14em}

const loaded={};
function loadScript(src){if(!loaded[src])loaded[src]=new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>{delete loaded[src];rej(new Error('無法載入 '+src))};document.head.appendChild(s)});return loaded[src]}
let KT=null,ktP=null;
function getTok(){if(KT)return Promise.resolve(KT);if(!ktP)ktP=(async()=>{await loadScript('https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/build/kuromoji.js');return await new Promise((res,rej)=>kuromoji.builder({dicPath:'https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/dict/'}).build((e,t)=>e?rej(e):res(t)))})().then(t=>KT=t).catch(e=>{ktP=null;throw e});return ktP}
async function prepImg(file){try{const bmp=await createImageBitmap(file);const sc=Math.min(1,2200/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);try{x.filter='grayscale(1) contrast(1.25)'}catch(e){}x.drawImage(bmp,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(r,'image/png'))}catch(e){return file}}
async function ocr(file,k){await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
 const vert=$('#vert_'+k)&&$('#vert_'+k).checked;
 const w=await Tesseract.createWorker(vert?'jpn_vert':'jpn',1,{logger:m=>{if(m.progress!=null){const p=$('#p_'+k);if(p)p.style.width=Math.round(m.progress*100)+'%';setSt(k,`<span class="sp"></span>辨識中（${m.status}）${Math.round(m.progress*100)}%`)}}});
 try{const img=await prepImg(file);const r=await w.recognize(img);return cleanOCR(r.data.text)}finally{await w.terminate()}}
const cleanOCR=t=>t.replace(/([\u3040-\u30ff\u4e00-\u9fff々ー、。！？「」（）])[ \t]+(?=[\u3040-\u30ff\u4e00-\u9fff々ー、。！？「」（）])/g,'$1').replace(/[ \t]+\n/g,'\n').trim();

/* ================= 日文分析：詞性／讀音／文法 ================= */
const STOP=new Set(['する','いる','ある','なる','できる','やる','くる','来る','言う','思う','れる','られる','ない','よう','こと','もの','ため','これ','それ','あれ','ところ']);
const sentsOf=t=>(t.match(/[^。！？!?\n]+[。！？!?]?/g)||[]).map(s=>s.trim()).filter(s=>s.length>1);
async function analyze(text){
 const sents=sentsOf(text);const map=new Map();let mode='kuromoji';let tok=null;
 try{tok=await getTok()}catch(e){mode='fallback'}
 const exOf=w=>sents.find(s=>s.includes(w))||'';
 if(tok){
  for(const t of tok.tokenize(text)){
   const pos=t.pos,d1=t.pos_detail_1;let label='';
   if(pos==='名詞'){if(d1==='固有名詞')label='固有名詞';else if(d1==='形容動詞語幹')label='な形容詞';else if(['一般','サ変接続','副詞可能'].includes(d1))label=d1==='サ変接続'?'名詞（する）':'名詞'}
   else if(pos==='動詞'&&d1==='自立')label='動詞';else if(pos==='形容詞'&&d1==='自立')label='い形容詞';else if(pos==='副詞')label='副詞';else if(pos==='連体詞'||pos==='接続詞')label=pos;
   if(!label)continue;
   const base=(t.basic_form&&t.basic_form!=='*')?t.basic_form:t.surface_form;
   if(STOP.has(base)||/^[ぁ-ん]{1,2}$/.test(base)||/^[0-9０-９a-zA-Zａ-ｚＡ-Ｚ]+$/.test(base)||base.length<2&&!hasKanji(base))continue;
   const e=map.get(base);if(e){e.count++;continue}
   let r=t.surface_form===base?kata2hira(t.reading||''):'';
   if(!r&&hasKanji(base)){try{r=kata2hira(tok.tokenize(base).map(x=>x.reading||x.surface_form).join(''))}catch(_){}}
   if(!hasKanji(base)&&!r)r=base;
   map.set(base,{w:base,r:hasKanji(base)?r:'',pos:label,count:1,m:'',e:'',ex:exOf(t.surface_form),sel:label!=='固有名詞'});
  }
 }else{
  (text.match(/[\u4e00-\u9fff]{2,}[ぁ-ん]{0,2}|[\u30a0-\u30ff]{3,}/g)||[]).forEach(w=>{const e=map.get(w);if(e)e.count++;else map.set(w,{w,r:'',pos:'',count:1,m:'',e:'',ex:exOf(w),sel:true})});
 }
 return{words:[...map.values()],grammar:detectGrammar(text,sents),mode};
}
function detectGrammar(text,sents){const out=[];const used=[];
 PD.forEach(g=>{const m=g.r.exec(text);if(!m)return;const hit=m[0];if(used.some(u=>u.includes(hit)&&u!==hit))return;used.push(hit);
  out.push({p:g.p,m:g.m,g:g.g,lv:g.lv,hit,ex:sents.find(s=>g.r.test(s))||'',sel:g.lv!=='N3'})});
 return out}

async function fetchTxt(url,proxy=true){const tries=[url];if(proxy)tries.push('https://api.allorigins.win/raw?url='+encodeURIComponent(url),'https://corsproxy.io/?'+encodeURIComponent(url));
 for(const u of tries){try{const r=await fetch(u);if(r.ok)return await r.text()}catch(e){}}throw new Error('無法連線：'+url)}
async function dictSearch(q,n=1){
 try{const r=await fetch('https://jotoba.de/api/search/words',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q,language:'English',no_english:false})});
  if(r.ok){const j=await r.json();const L=(j.words||[]).slice(0,n).map(x=>({w:(x.reading&&(x.reading.kanji||x.reading.kana))||q,r:(x.reading&&x.reading.kana)||'',e:(x.senses||[]).slice(0,3).map(s=>(s.glosses||[]).slice(0,3).join(', ')).filter(Boolean).join('; '),pos:''}));if(L.length)return L}}catch(e){}
 try{const t=await fetchTxt('https://jisho.org/api/v1/search/words?keyword='+encodeURIComponent(q));const j=JSON.parse(t);const L=(j.data||[]).slice(0,n).map(x=>({w:(x.japanese[0].word||x.japanese[0].reading),r:x.japanese[0].reading||'',e:(x.senses||[]).slice(0,3).map(s=>(s.english_definitions||[]).slice(0,3).join(', ')).join('; '),pos:''}));if(L.length)return L}catch(e){}
 return[]}
async function runPool(items,fn,conc=4){let i=0;await Promise.all(Array.from({length:Math.min(conc,items.length)},async()=>{while(i<items.length){const k=i++;try{await fn(items[k],k)}catch(e){}}}))}
async function ai(prompt,max=2500){if(!S.aiKey)throw new Error('尚未設定 AI 金鑰（到設定頁填寫）');
 const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':S.aiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:S.aiModel||'claude-sonnet-5-5',max_tokens:max,messages:[{role:'user',content:prompt}]})});
 const j=await r.json();if(!r.ok)throw new Error((j.error&&j.error.message)||('HTTP '+r.status));return(j.content||[]).map(c=>c.text||'').join('')}
const jparse=t=>{const m=t.match(/[\[{][\s\S]*[\]}]/);return JSON.parse(m?m[0]:t)};
async function aiZh(words){const txt=await ai(`請把下列日文單字翻成簡短的繁體中文意思（每個不超過 12 字，動詞用原形意思）。只輸出 JSON 物件，鍵為日文單字、值為中文。\n${JSON.stringify(words)}`,1500);return jparse(txt)}

 for(const f of files){try{
  if(f.type.startsWith('image/')){setSt(k,`<span class="sp"></span>準備辨識：${esc(f.name)}`);out.push(await ocr(f,k))}

 }catch(e){setSt(k,'讀取失敗：'+esc(e.message)+'（若離線，請改貼上文字）',true)}}
 const text=out.join('\n').trim();if(text){$('#t_'+k).value=text;$('#p_'+k).style.width='100%';runText(k)}}

 if(j&&!Array.isArray(j)&&(j.words||j.grammar)){mergeData(j);save();toast('已匯入備份資料');render();return true}

 if(mode==='jp2m'||mode==='m2jp'){if(withM.length<4){eff='flash';toast('有意思的單字不足 4 個，改用閃卡')}}

async function articleQs(kind){const a=AR.a,back='#/news/'+AR.i;let items=[];
 const rc=async()=>{let L=a.rc;if(!L&&S.aiKey){try{toast('AI 出題中…',6000);const arr=jparse(await ai(`請依下列日文新聞內容，出 3 題繁體中文提問的閱讀理解四選一題，並用日文原文語意作答。只輸出 JSON 陣列：[{"p":"題目","o":["A","B","C","D"],"a":正確選項索引0-3,"w":"簡短解說"}]\n\n${a.body}`,2000));L=arr.filter(q=>q.p&&Array.isArray(q.o)&&q.o.length===4&&q.a>=0&&q.a<4);a.rc=L;a.rcZh=1;save(true)}catch(e){toast('AI 出題失敗：'+e.message,3500)}}
  if(L&&L.length)return L.map(q=>({type:'mc',jo:1,zp:a.rcZh?1:0,p:esc(q.p),sub:'',o:q.o,a:q.a,why:q.w||'',sum:esc(q.p)+'<br><small>正解：'+esc(q.o[q.a])+'</small>'}));
  const sents=sentsOf(a.body).filter(s=>s.length>10);const ws=AR.words.filter(w=>w.pos&&/名詞|動詞|形容詞/.test(w.pos));
  return shuffle(sents).slice(0,3).map(s=>{const t=ws.find(w=>s.includes(w.w));if(!t)return null;const others=shuffle(ws.filter(w=>w!==t&&w.pos===t.pos)).slice(0,3);if(others.length<3)return null;const o=shuffle([t.w,...others.map(w=>w.w)]);
   return{type:'mc',s:1,p:esc(s.replace(t.w,'（　）')),sub:'填入文章中原本的詞',o,a:o.indexOf(t.w),why:'原文：'+s,sum:esc(s)}}).filter(Boolean)};
 const wq=()=>{const pool=AR.words.map(w=>({w:w.w,r:w.r,pos:w.pos,m:w.m,e:w.e,ex:w.ex}));return buildVocabQs({mode:'jp2m',lang:'en',n:6,pool})};
 const gq=()=>{const dict=PD;return AR.gram.slice(0,5).map(g=>{const c=core(g.p);const near=shuffle(dict.filter(x=>x.g===(PD.find(p=>p.p===g.p)||{}).g&&core(x.p)!==c)).slice(0,2).map(x=>core(x.p));const far=shuffle(dict.filter(x=>core(x.p)!==c&&!near.includes(core(x.p)))).slice(0,3-near.length).map(x=>core(x.p));
  const o=shuffle([c,...near,...far]);const ex=g.ex||'';const base=ex.includes(g.hit)?ex.replace(g.hit,'（　）'):'';if(!base)return null;return{type:'mc',s:1,p:esc(base),sub:'意思：'+g.m,o,a:o.indexOf(c),why:`答案：${g.p}（${g.m}）`,on:ok=>{if(!ok){D.weak[c]=(D.weak[c]||0)+1;save(true)}},sum:esc(ex)+'<br><small>'+esc(g.p)+'</small>'}}).filter(Boolean)};
 if(kind==='rc')items=await rc();else if(kind==='w')items=wq();else if(kind==='g')items=gq();else items=[...(await rc()),...wq().slice(0,4),...gq().slice(0,3)];
 startQuiz({title:'新聞測驗',items,back})}

/* ================= 同步 ================= */
function mergeData(R){const L=D;L.del=Object.assign({},R.del||{},L.del);
 const mergeArr=(a,b)=>{const m=new Map();[...(a||[]),...(b||[])].forEach(x=>{const o=m.get(x.id);if(!o||(x.u||0)>(o.u||0))m.set(x.id,x)});return[...m.values()].filter(x=>!(L.del[x.id]&&L.del[x.id]>=(x.u||0))).sort((p,q)=>(q.u||0)-(p.u||0))};
 L.words=mergeArr(L.words,R.words);L.grammar=mergeArr(L.grammar,R.grammar);L.aiQs=mergeArr(L.aiQs,R.aiQs).slice(0,120);
 Object.keys(R.news||{}).forEach(k=>{if(!L.news[k])L.news[k]=R.news[k]});
 const mx=(a,b)=>{const o={...a};Object.keys(b||{}).forEach(k=>o[k]=Math.max(o[k]||0,b[k]));return o};L.weak=mx(L.weak,R.weak);
 L.gst={...L.gst};Object.keys(R.gst||{}).forEach(k=>{const a=L.gst[k]||{w:0,r:0},b=R.gst[k];L.gst[k]={w:Math.max(a.w,b.w),r:Math.max(a.r,b.r)}});
 if((R.u||0)>(L.u||0)&&Array.isArray(R.cats)){const ids=R.cats.map(c=>c.id);const keep=L.cats.filter(c=>!ids.includes(c.id)&&c.t==='custom');L.cats=[...R.cats,...keep]}
 else if(Array.isArray(R.cats)){R.cats.forEach(c=>{if(!L.cats.some(x=>x.id===c.id))L.cats.push(c)})}
 L.hist=[...(R.hist||[]),...L.hist].sort((a,b)=>b.t-a.t).slice(0,30)}
async function gh(path,opt={}){const r=await fetch('https://api.github.com'+path,{...opt,headers:{'Authorization':'Bearer '+S.token,'Accept':'application/vnd.github+json','Content-Type':'application/json'}});const j=await r.json();if(!r.ok)throw new Error(j.message||('HTTP '+r.status));return j}
async function syncPush(){if(!S.token)throw new Error('請先填入 GitHub Token');const files={'japanese-notebook.json':{content:JSON.stringify(D)}};
 if(S.gist)await gh('/gists/'+S.gist,{method:'PATCH',body:JSON.stringify({files})});else{const j=await gh('/gists',{method:'POST',body:JSON.stringify({description:'日本語ノート 同步資料',public:false,files})});S.gist=j.id;saveS()}}
async function syncPull(){if(!S.token||!S.gist)throw new Error('請填入 Token 與 Gist ID');const j=await gh('/gists/'+S.gist);const f=j.files['japanese-notebook.json'];if(!f)throw new Error('Gist 內找不到資料檔');
 let txt=f.content;if(f.truncated)txt=await(await fetch(f.raw_url)).text();mergeData(JSON.parse(txt));save(true)}

const DEF_MODEL={gemini:'gemini-2.5-flash',openai:'gpt-4o-mini',anthropic:'claude-sonnet-5-5'};
const modelOf=()=>((S.mdl||{})[S.aiProv]||DEF_MODEL[S.aiProv]||DEF_MODEL.gemini);
async function ai(prompt,max=2500,images){
 if(!S.aiKey)throw new Error('尚未設定 AI 金鑰（到「個人」頁填寫）');
 const prov=S.aiProv||'gemini',model=modelOf(),imgs=images||[];let url,opt,pick;
 if(prov==='gemini'){
  const gc={temperature:.2,maxOutputTokens:Math.max(max,8192)};if(/JSON/.test(prompt))gc.responseMimeType='application/json';if(/2\.5-flash/.test(model))gc.thinkingConfig={thinkingBudget:0};
  url=`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(S.aiKey)}`;
  opt={method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({contents:[{role:'user',parts:[{text:prompt},...imgs.map(i=>({inline_data:{mime_type:i.mime,data:i.b64}}))]}],generationConfig:gc})};
  pick=j=>(((j.candidates||[])[0]||{}).content&&((j.candidates[0].content.parts)||[]).map(p=>p.text||'').join(''))||''}
 else if(prov==='openai'){
  url='https://api.openai.com/v1/chat/completions';
  opt={method:'POST',headers:{'content-type':'application/json','Authorization':'Bearer '+S.aiKey},body:JSON.stringify({model,messages:[{role:'user',content:[{type:'text',text:prompt},...imgs.map(i=>({type:'image_url',image_url:{url:`data:${i.mime};base64,${i.b64}`}}))]}]})};
  pick=j=>((j.choices||[])[0]&&j.choices[0].message&&j.choices[0].message.content)||''}
 else{
  url='https://api.anthropic.com/v1/messages';
  opt={method:'POST',headers:{'content-type':'application/json','x-api-key':S.aiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model,max_tokens:Math.max(max,4096),messages:[{role:'user',content:[...imgs.map(i=>({type:'image',source:{type:'base64',media_type:i.mime,data:i.b64}})),{type:'text',text:prompt}]}]})};
  pick=j=>(j.content||[]).map(c=>c.text||'').join('')}
 const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),90000);let r,j;
 try{r=await fetch(url,{...opt,signal:ctl.signal});j=await r.json().catch(()=>({}))}catch(e){throw new Error(e.name==='AbortError'?'AI 回應逾時（90 秒）':'無法連線到 AI 服務（請檢查網路或金鑰）')}finally{clearTimeout(to)}
 if(!r.ok){const m=(j.error&&(j.error.message||j.error))||('HTTP '+r.status);throw new Error(typeof m==='string'?m:JSON.stringify(m))}
 const out=pick(j);if(!out)throw new Error('AI 沒有回傳內容');return out}

async function fetchTxt(url,proxy=true,ms=7000){
 const tryF=async(u,unwrap)=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(u,{signal:c.signal});if(!r.ok)throw new Error('http');const x=await r.text();return unwrap?(JSON.parse(x).contents||''):x}finally{clearTimeout(t)}};
 const steps=[()=>tryF(url)];
 if(proxy)steps.push(()=>tryF('https://api.allorigins.win/get?url='+encodeURIComponent(url),true),()=>tryF('https://api.allorigins.win/raw?url='+encodeURIComponent(url)),()=>tryF('https://corsproxy.io/?'+encodeURIComponent(url)));
 for(const s of steps){try{const t=await s();if(t&&t.length>20)return t}catch(e){}}
 throw new Error('無法連線：'+url)}
async function getJSONT(url,ms=8000){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(url,{signal:c.signal});if(!r.ok)throw new Error('http');return await r.json()}finally{clearTimeout(t)}}

function compressImg(file,max=1600,q=.82){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const im=new Image();
 im.onload=()=>{try{const sc=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.naturalWidth*sc));c.height=Math.max(1,Math.round(im.naturalHeight*sc));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);const d=c.toDataURL('image/jpeg',q);c.toBlob(b=>{URL.revokeObjectURL(u);res({blob:b,dataUrl:d,b64:d.split(',')[1],mime:'image/jpeg'})},'image/jpeg',q)}catch(e){URL.revokeObjectURL(u);rej(e)}};
 im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('無法讀取圖片（HEIC 等格式請改存成 JPG／PNG）'))};im.src=u})}
const normW=x=>({w:String(x.w||x.word||'').trim(),r:kata2hira(String(x.r||x.reading||'').trim()),pos:x.pos||'',m:x.m||x.zh||x.meaning||'',e:x.e||x.en||'',k:x.k||x.ko||'',ex:x.ex||'',xt:(x.xt&&typeof x.xt==='object')?x.xt:{},ac:x.ac==null?'':x.ac,count:x.count||1,sel:x.sel!==false});
async function aiExtract({images=[],text=''}){
 const prompt=`你是日語教學助理。${images.length?'請閱讀附上的圖片（可能是課本、手寫筆記或文章截圖）':'請閱讀下列文字'}，不管內容形式，自動精準萃取出所有值得學習的日文單字（略過助詞、助動詞與過於基礎的詞；活用詞請還原為辭書形）。\n只輸出 JSON 陣列，每個元素格式：\n{"w":"日文單字（含漢字，辭書形）","r":"平假名讀音","pos":"詞性，例：名・他動、動・自、い形、な形、副","m":"繁體中文意思","e":"English meaning","k":"한국어 뜻","ex":"原文中出現該單字的完整例句（內容中沒有則自行造一句簡短自然的日文例句）","xt":{"zh":"例句繁體中文翻譯","en":"example translation in English","ko":"예문 한국어 번역"},"ac":重音核位置的整數（平板型為 0，不確定則 null）}\n不要輸出任何說明文字。${text?'\n\n文字內容：\n'+text.slice(0,6000):''}`;
 const arr=jparse(await ai(prompt,8000,images));if(!Array.isArray(arr))throw new Error('AI 回傳格式不是清單');
 const seen=new Set();return arr.map(normW).filter(x=>x.w&&!seen.has(x.w)&&seen.add(x.w))}
function parseList(text){const lines=text.split(/\n/).map(l=>l.trim()).filter(Boolean);const st=lines.filter(l=>{const c=splitCols(l);return c.length>=2&&/[぀-ヿ一-鿿]/.test(c[0])&&c[0].length<=20});
 if(lines.length&&st.length/lines.length>=.6)return st.map(l=>{const c=splitCols(l);const kana=/^[ぁ-んァ-ヶー]+$/.test(c[1]||'');return normW({w:c[0],r:kana?c[1]:'',m:kana?c.slice(2).join(' '):c.slice(1).join(' ')})});return null}
function finishExtract(L,label){VC.items=L;markDup(VC.items);if(!L.length){setSt('v','沒有擷取到單字，請換一張更清晰的照片，或改貼上文字。',true);return}
 setSt('v',`${label}：找到 ${L.length} 個候選詞，請在彈出清單確認。`);openPreview()}
async function vText(text){const L=parseList(text);if(L){finishExtract(L,'清單匯入');return}
 if(S.aiKey){try{setSt('v','<span class="sp"></span>AI 整理單字中…');finishExtract(await aiExtract({text}),'AI 擷取');return}catch(e){setSt('v','AI 失敗：'+esc(e.message)+'；改用內建分析…',true)}}
 setSt('v','<span class="sp"></span>分析詞性與讀音中…（首次需載入詞典）');
 try{const r=await analyze(text);finishExtract(r.words.map(x=>normW(x)),r.mode==='kuromoji'?'內建詞典分析':'簡易擷取（詞典載入失敗）')}catch(e){setSt('v','分析失敗：'+esc(e.message),true)}}

async function vFiles(files){const imgs=files.filter(f=>f.type.startsWith('image/')),others=files.filter(f=>!f.type.startsWith('image/'));let text='';$('#p_v').style.width='0';
 for(const f of others){try{const t=await f.text();if(/\.json$/i.test(f.name)&&importJSON(t,'v'))return;text+='\n'+t}catch(e){}}
 if(imgs.length){setSt('v','<span class="sp"></span>壓縮圖片中…');const pics=[];
  for(const f of imgs.slice(0,6)){try{pics.push(await compressImg(f))}catch(e){setSt('v','圖片讀取失敗：'+esc(e.message),true)}}
  if(!pics.length)return;

  try{const o=[];for(const p of pics)o.push(await ocr(p.blob,'v'));text=(text+'\n'+o.join('\n')).trim()}catch(e){setSt('v','OCR 失敗：'+esc(e.message)+'（若離線，請改貼上文字）',true);return}}
 if(text.trim()){$('#t_v').value=text.trim();$('#p_v').style.width='100%';return vText(text)}
 setSt('v','沒有可處理的內容',true)}
async function handleFiles(files,k){

 return false}

 <label class="l" style="display:block;margin:10px 0 4px;font-size:11px;color:var(--brown2)">GitHub Token</label><input type="password" value="${esc(S.token)}" data-c="sToken" autocomplete="off"><label class="l" style="display:block;margin:10px 0 4px;font-size:11px;color:var(--brown2)">Gist ID（首次上傳自動建立）</label><input value="${esc(S.gist)}" data-c="sGist">
 <div class="set-r"><div><b>變更後自動上傳</b></div><input type="checkbox" ${S.auto?'checked':''} data-c="sAuto"></div>
 <div class="acts2"><button class="btn lime" data-a="syncUp">${ic('upload')}上傳到雲端</button><button class="btn" data-a="syncDown">下載並合併</button></div><div id="syncSt" class="hint"></div></section>
 <section class="card"><h3 class="ct">資料備份與還原</h3><div class="acts2"><button class="btn pri" data-a="exp">下載備份 JSON</button><label class="btn">匯入 JSON<input type="file" accept=".json" hidden data-c="impFile"></label><button class="btn" data-a="reset" style="color:var(--acc)">清除全部資料</button></div><p class="hint">資料存在這個瀏覽器的 localStorage；換裝置請用備份或同步。</p></section>`}

/* ---------- 事件處理（新增／覆蓋） ---------- */
Object.assign(A,{
 setLang:t=>{S.lang=t.dataset.v;saveS();render.keep=true;render()},
 dailyGo:()=>startCards({ids:pickDaily().map(w=>w.id),title:'每日複習',back:'#/'}),
 vFolder:t=>{vFolder=t.dataset.f;renderVList()},
 vTab:t=>{vTab=t.dataset.t;renderVList()},
 vCards:()=>{const L=vFiltered();startCards({ids:shuffle(L).slice(0,50).map(w=>w.id),title:'翻轉單字卡',back:'#/vocab'})},
 vGo:t=>{vFolder=t.dataset.id;location.hash='#/vocab'},
 foldFlip:t=>startCards({ids:shuffle(scopeWords('f:'+t.dataset.id)).slice(0,50).map(w=>w.id),title:'資料夾複習',back:location.hash.startsWith('#/cat')?location.hash:'#/test'}),
 vQuizSheet:t=>vQuizSheet(t.dataset.src||'all',null,null,location.hash||'#/test'),
 catQuiz:t=>vQuizSheet('f:'+t.dataset.id,null,null,'#/cat/'+t.dataset.id),
 qzGo:t=>{const mode=$('#qz_m').value,lang=$('#qz_l').value,n=+$('#qz_n').value,sv=$('#qz_s').value;S.qn=n;S.lang=lang;saveS();const back=t.dataset.back||'#/test';
  if(mode==='flip'){const L=shuffle(scopeWords(sv)).slice(0,n);closeSheet();return startCards({ids:L.map(w=>w.id),title:'翻轉單字卡',back})}
  let src=sv,cat=null;if(sv.startsWith('f:')){src='cat';cat=sv.slice(2)}
  const items=buildVocabQs({src,cat,mode,lang,n});closeSheet();startQuiz({title:'單字測驗',items,back})},
 vFoundAdd:t=>{const x=VC.found[+t.dataset.n];addWords([{w:x.w,r:x.r,e:x.e}],vFolder==='all'?'':vFolder);toast('已加入單字表');renderVList()},
 wAdd:()=>wSheet({w:'',r:'',m:'',e:'',k:'',ex:'',xt:{},pos:'',ac:'',f:vFolder==='all'?'':vFolder}),
 wSave:t=>{const v=id=>$(id).value.trim();if(!v('#e_w'))return toast('請輸入單字');
  const o={w:v('#e_w'),r:v('#e_r'),pos:v('#e_p'),ac:v('#e_a'),m:v('#e_m'),e:v('#e_e'),k:v('#e_k'),ex:v('#e_x'),xt:{zh:v('#e_xz'),en:v('#e_xe'),ko:v('#e_xk')},f:$('#e_f').value};
  if(t.dataset.id){Object.assign(D.words.find(x=>x.id===t.dataset.id),o,{u:Date.now()})}else{addWords([o],o.f)}
  save();closeSheet();location.hash.startsWith('#/vocab')?renderVList():render()},
 catDel:t=>{const c=D.cats.find(x=>x.id===t.dataset.id);if(!c||!confirm(`刪除資料夾「${c.n}」？（裡面的單字會移到「未分類」）`))return;D.words.forEach(w=>{if(w.f===c.id){w.f='';w.u=Date.now()}});D.cats=D.cats.filter(x=>x!==c);if(vFolder===c.id)vFolder='all';save();render()},
 catRename:()=>{const c=D.cats.find(x=>x.id===vFolder);if(!c)return;const n=prompt('資料夾名稱',c.n);if(n&&n.trim()){c.n=n.trim();save();render.keep=true;render()}},
 catPick:t=>{const id=t.dataset.id;sheet(`<h3>加入單字到此資料夾</h3>${D.words.length?`<div style="max-height:50vh;overflow:auto">${D.words.map(w=>`<label class="chk" style="padding:7px 0;border-bottom:1px solid var(--line2)"><input type="checkbox" class="cp" value="${w.id}" ${(w.f||'')===id?'checked':''}> <b class="jp">${esc(w.w)}</b> <small>${esc(mean(w,S.lang))}</small></label>`).join('')}</div>`:'<div class="empty">單字表是空的</div>'}<div class="acts2"><button class="btn pri" data-a="catPickSave" data-id="${id}">完成</button></div>`)},
 catPickSave:t=>{const id=t.dataset.id,sel=new Set($$('.cp').filter(x=>x.checked).map(x=>x.value));D.words.forEach(w=>{if(sel.has(w.id)){if(w.f!==id){w.f=id;w.u=Date.now()}}else if(w.f===id){w.f='';w.u=Date.now()}});save();closeSheet();render()},
 /* 預覽確認清單 */
 pvSel:t=>{const c=VC.items[+t.dataset.n];c.sel=!c.sel;pvRender()},
 pvAll:t=>{VC.items.forEach(c=>c.sel=t.dataset.v==='1');pvRender()},
 pvAdd:()=>{const f=$('#pv_f').value;const L=VC.items.filter(c=>c.sel&&c.w);const n=addWords(L.map(c=>({...c,src:'上傳'})),f);VC.items=VC.items.filter(c=>!c.sel);vFolder=f||'all';closeSheet();toast(`已匯入 ${n} 個單字`);if(location.hash.startsWith('#/vocab')){setSt('v',`已匯入 ${n} 個單字`);renderVList()}else render()},
 pvFill:async()=>{const L=VC.items.filter(c=>c.sel&&(!c.m||!c.e||!c.k||!c.pos||!c.r)).slice(0,40);const st=$('#pvSt');if(!L.length){toast('選取項目的資料已完整');return}
  if(S.aiKey){st.innerHTML='<span class="sp"></span>AI 補全中…';try{const arr=jparse(await ai(`請為下列日文單字補全資料，只輸出 JSON 陣列，元素格式：{"w":"原單字","r":"平假名讀音","pos":"詞性，例：名・他動","m":"繁體中文意思","e":"English","k":"한국어 뜻"}。\n${JSON.stringify(L.map(c=>({w:c.w,ex:c.ex})))}`,4000));arr.forEach(x=>{const c=L.find(y=>y.w===x.w);if(c)['r','pos','m','e','k'].forEach(f=>{if(!c[f]&&x[f])c[f]=f==='r'?kata2hira(x[f]):x[f]})});pvRender();$('#pvSt').textContent='已補全'}catch(e){st.textContent='AI 失敗：'+e.message}return}
  st.innerHTML='<span class="sp"></span>查詢詞典（英文）…';let n=0;await runPool(L,async c=>{const r=(await dictSearch(c.w,1))[0];if(r){if(!c.e)c.e=r.e;if(!c.r&&r.r&&hasKanji(c.w))c.r=r.r}n++;st.textContent=`查詢中 ${n}/${L.length}`},4);pvRender();$('#pvSt').textContent='已補上英文詞義；中文／韓文需要設定 AI 金鑰'},
 /* 翻轉卡 */
 fcFlip:()=>{const e=$('#fcIn');e&&e.classList.toggle('flip')},
 fcFuri:()=>{CS.furi=!CS.furi;const w=$('#fcWord');w&&w.classList.toggle('nofuri',!CS.furi);const b=$('#fcFuriBtn');b&&(b.textContent='假名 '+(CS.furi?'ON':'OFF'))},
 fcSpeak:()=>{const w=curW();if(!w)return;if(!('speechSynthesis' in window)||typeof SpeechSynthesisUtterance==='undefined')return toast('此瀏覽器不支援語音朗讀');try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w.w);u.lang='ja-JP';u.rate=.9;speechSynthesis.speak(u)}catch(e){toast('語音朗讀失敗')}},
 fcStar:()=>{const w=curW();if(!w)return;w.fav=!w.fav;w.u=Date.now();save();$$('[data-a=fcStar]').forEach(b=>b.classList.toggle('on',!!w.fav))},
 fcWrong:()=>{const w=curW();if(!w)return;w.wrong=w.wrong>0?0:1;w.u=Date.now();save();$$('[data-a=fcWrong]').forEach(b=>b.classList.toggle('on',w.wrong>0));toast(w.wrong>0?'已標記為錯題':'已取消錯題標記')},
 fcGrade:t=>{const w=curW();if(!w)return;const v=t.dataset.v;
  if(v==='again'){w.wrong=(w.wrong||0)+1;w.st='';CS.res.again++;const c=CS.re[w.id]||0;if(c<2){CS.re[w.id]=c+1;CS.q.splice(Math.min(CS.i+4,CS.q.length),0,w.id)}}
  else if(v==='vague'){w.st='vague';CS.res.vague++}else{w.st='known';w.wrong=0;CS.res.known++}
  w.u=Date.now();bump();save();CS.i++;render()},
 fcNav:t=>{if(!CS)return;const d=+t.dataset.d;if(CS.i+d<0)return;CS.i=Math.min(CS.q.length,CS.i+d);render()},
 fcAgain:()=>{const ids=[...new Set(CS.q)].filter(id=>{const w=D.words.find(x=>x.id===id);return w&&w.st!=='known'});if(!ids.length)return toast('全部都已掌握了');startCards({ids:shuffle(ids),title:CS.title,back:CS.back})},
 /* 新聞 */
 furiTog:()=>{S.furi=!S.furi;saveS();const c=$('#artCard');c&&c.classList.toggle('nofuri',!S.furi);const b=$('#furiBtn');b&&(b.textContent='ふりがな '+(S.furi?'ON':'OFF'));if(S.furi&&!KT)toast('詞典載入後才會顯示ふりがな')},
 reset:()=>{if(confirm('確定清除所有單字、文法與紀錄？此動作無法復原。')&&confirm('再次確認：全部清除？')){D=newDefaults();normalizeData();save(true);render()}}
});
document.addEventListener('change',e=>{const t=e.target,c=t.dataset&&t.dataset.c;if(!c)return;
 if(c==='wMove'){const w=D.words.find(x=>x.id===t.dataset.id);if(!w)return;w.f=t.value;w.u=Date.now();save();toast(`已移至「${t.value?((D.cats.find(x=>x.id===t.value)||{}).n||''):'未分類'}」`);if(location.hash.startsWith('#/vocab'))renderVList();else{render.keep=true;render()}}
 else if(c==='sProv'){S.aiProv=t.value;saveS();render.keep=true;render()}
 else if(c==='meGoal'){D.me.goal=t.value;save()}});
document.addEventListener('input',e=>{const t=e.target,i=t.dataset&&t.dataset.i;if(!i)return;
 if(i==='pvF'){const c=VC.items[+t.dataset.n];if(c)c[t.dataset.f]=t.value}
 else if(i==='meName'){D.me.name=t.value;save(true)}
 else if(i==='hsearch'){const q=t.value.trim().toLowerCase(),el=$('#hsr');if(!el)return;if(!q){el.innerHTML='';return}
  const ws=D.words.filter(w=>(w.w+w.r+(w.m||'')+(w.e||'')+(w.k||'')).toLowerCase().includes(q)).slice(0,6),gs=D.grammar.filter(g=>(g.p+g.m).toLowerCase().includes(q)).slice(0,4);
  el.innerHTML=(ws.length||gs.length)?ws.map(w=>`<div class="hs-r" data-a="wEdit" data-id="${w.id}"><b class="jp">${esc(w.w)}</b><small>${esc(w.r)}</small><span>${esc(mean(w,S.lang))}</span></div>`).join('')+gs.map(g=>`<div class="hs-r" data-a="gEdit" data-id="${g.id}"><b class="jp">${esc(g.p)}</b><span>${esc(g.m)}</span></div>`).join(''):`<div class="hs-r"><small>找不到「${esc(t.value.trim())}」</small></div>`}});

/* 啟動 */
load();render();
if(S.auto&&S.token&&S.gist)syncPull().then(()=>{if(!location.hash.startsWith('#/quiz'))render()}).catch(()=>{});
</script>
</body>
</html>
